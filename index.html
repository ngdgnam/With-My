<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GZW_Wolfsamson</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<style>
  :root{
    --ink:#e9e4e0;
    --card-bg: rgba(8,8,10,0.42);
    --card-border: rgba(255,255,255,0.14);
    --glow: rgba(180,20,20,0.4);
    --accent:#c94b4b;
    --accent-deep:#8f2f2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:#000 url('bg.png') center/cover no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  .card{
    position:relative;
    width:min(360px, 88vw);
    padding:38px 26px 26px;
    border-radius:18px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    box-shadow:0 8px 40px rgba(0,0,0,0.6), 0 0 60px var(--glow);
    text-align:center;
    color:var(--ink);
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  /* ambient drifting smoke glow behind everything on the card */
  .card::before{
    content:"";
    position:absolute;
    inset:-40%;
    background:
      radial-gradient(circle at 30% 20%, rgba(201,75,75,0.25), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(140,140,150,0.18), transparent 60%);
    animation:drift 14s ease-in-out infinite alternate;
    z-index:0;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform:translate(-4%,-2%) rotate(0deg); }
    100%{ transform:translate(4%,3%) rotate(8deg); }
  }

  .card > *{ position:relative; z-index:1; }

  @keyframes rise{
    from{opacity:0; transform:translateY(18px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* avatar with a slowly rotating ember ring + gentle float */
  .avatar-wrap{
    position:relative;
    width:110px;
    height:110px;
    margin:0 auto 18px;
    animation:float 4.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 30%, transparent 70%, var(--accent));
    filter:blur(2px);
    animation:spin 6s linear infinite;
    opacity:.85;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
  .avatar{
    position:absolute;
    inset:5px;
    width:100px; height:100px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(0,0,0,0.6);
    box-shadow:0 0 22px rgba(0,0,0,0.7);
  }

  .name{
    font-size:24px;
    font-weight:700;
    letter-spacing:.6px;
    margin-bottom:22px;
    animation:glowpulse 3.2s ease-in-out infinite;
  }
  @keyframes glowpulse{
    0%,100%{ text-shadow:0 0 10px rgba(201,75,75,.5); }
    50%{ text-shadow:0 0 20px rgba(201,75,75,.9), 0 0 34px rgba(201,75,75,.4); }
  }

  .socials{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .social{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:var(--ink);
    text-decoration:none;
    opacity:0;
    animation:fadein .5s ease forwards;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease, color .18s ease;
  }
  .social:nth-child(1){ animation-delay:.5s; }
  .social:nth-child(2){ animation-delay:.6s; }
  .social:nth-child(3){ animation-delay:.7s; }
  .social:nth-child(4){ animation-delay:.8s; }
  .social:nth-child(5){ animation-delay:.9s; }
  .social:nth-child(6){ animation-delay:1s; }
  @keyframes fadein{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .social:hover{
    transform:translateY(-3px);
    background:var(--accent-deep);
    color:#fff;
    box-shadow:0 6px 16px rgba(201,75,75,.5);
  }
  .social svg{ width:18px; height:18px; }

  .music-btn{
    position:absolute;
    top:14px; right:14px;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:var(--ink);
    cursor:pointer;
    z-index:2;
    transition:background .18s ease, box-shadow .18s ease;
  }
  .music-btn:hover{
    background:var(--accent-deep);
    box-shadow:0 4px 14px rgba(201,75,75,.5);
  }
  .music-btn svg{ width:16px; height:16px; }
  .music-btn .bar{
    display:inline-block; width:2.5px; margin:0 1px;
    background:currentColor; border-radius:2px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .music-btn.playing .bar{ animation-play-state:running; }
  .music-btn:not(.playing) .bar{ animation-play-state:paused; height:4px !important; }
  .bar:nth-child(1){ animation-delay:0s; }
  .bar:nth-child(2){ animation-delay:.15s; }
  .bar:nth-child(3){ animation-delay:.3s; }
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:14px; }
  }

  /* floating embers drifting up over the whole page */
  .embers{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .ember{
    position:absolute;
    bottom:-20px;
    width:4px; height:4px;
    border-radius:50%;
    background:radial-gradient(circle, #ffb37a 0%, var(--accent) 60%, transparent 100%);
    box-shadow:0 0 6px 2px rgba(201,75,75,.6);
    animation-name:emberRise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    opacity:0;
  }
  @keyframes emberRise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform:translateY(-105vh) translateX(var(--drift, 30px)); opacity:0; }
  }

  /* now playing card */
  .now-playing{
    position:relative;
    z-index:1;
    width:min(360px, 88vw);
    margin-top:14px;
    padding:12px 14px;
    border-radius:16px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ink);
    opacity:0;
    transform:translateY(10px);
    max-height:0;
    padding-top:0; padding-bottom:0;
    overflow:hidden;
    transition:opacity .4s ease, transform .4s ease, max-height .4s ease, padding .4s ease, margin .4s ease;
  }
  .now-playing.show{
    opacity:1;
    transform:translateY(0);
    max-height:100px;
    padding:12px 14px;
  }
  .np-cover{
    width:46px; height:46px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
    box-shadow:0 0 12px rgba(0,0,0,.6);
  }
  .np-info{
    flex:1;
    min-width:0;
    text-align:left;
  }
  .np-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.6;
    margin-bottom:2px;
  }
  .np-title{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .np-eq{
    display:flex;
    align-items:flex-end;
    gap:2.5px;
    height:16px;
    flex-shrink:0;
  }
  .np-eq .bar2{
    display:inline-block; width:3px;
    background:var(--accent);
    border-radius:2px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .np-eq .bar2:nth-child(1){ animation-delay:0s; }
  .np-eq .bar2:nth-child(2){ animation-delay:.15s; }
  .np-eq .bar2:nth-child(3){ animation-delay:.3s; }
  .np-eq .bar2:nth-child(4){ animation-delay:.45s; }

  .social{ font: inherit; }
  button.social{ appearance:none; -webkit-appearance:none; }

  .qr-overlay{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .qr-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .qr-box{
    background:#fff;
    border-radius:16px;
    padding:20px 20px 16px;
    width:min(280px, 82vw);
    text-align:center;
    transform:scale(.92);
    transition:transform .25s ease;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .qr-overlay.show .qr-box{ transform:scale(1); }
  .qr-box img{
    width:100%;
    border-radius:8px;
    display:block;
  }
  .qr-box p{
    margin-top:10px;
    font-size:13px;
    color:#333;
  }

  .tt-box{
    padding:22px 20px;
  }
  .tt-heading{
    margin:0 0 14px;
    font-size:14px;
    font-weight:700;
    color:#111;
  }
  .tt-link{
    display:block;
    padding:11px 14px;
    margin-bottom:10px;
    border-radius:10px;
    background:#f3f3f3;
    color:#111;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease;
  }
  .tt-link:last-child{ margin-bottom:0; }
  .tt-link:hover{
    background:var(--accent);
    color:#fff;
    transform:translateY(-1px);
  }
</style>
</head>

      <img src="wechat-qr.jpg" alt="WeChat QR">

    </div>
  </div>

    <div class="qr-box tt-box">
      <p class="tt-heading">Chọn tài khoản TikTok</p>
      <a class="tt-link" href="https://www.tiktok.com/@ngdgnam207?_r=1&_t=ZS-98XveOuwAiL" target="_blank" rel="noopener">@ngdgnam207</a>
      <a class="tt-link" href="https://www.tiktok.com/@ngkhungmathmath?_r=1&_t=ZS-98XvzfzUKY9" target="_blank" rel="noopener">@ngkhungmathmath</a>
    </div>
  </div>

  <div class="now-playing" id="npCard">
    <img class="np-cover" src="avatar.jpg" alt="cover">
    <div class="np-info">
      <div class="np-label">Đang phát</div>
      <div class="np-title" id="npTitle">music.mp3</div>
    </div>
    <div class="np-eq">
      <span class="bar2" style="height:5px"></span>
      <span class="bar2" style="height:10px"></span>
      <span class="bar2" style="height:6px"></span>
      <span class="bar2" style="height:12px"></span>
    </div>
  </div>

  <script>
    const btn = document.getElementById('musicBtn');
    const audio = document.getElementById('bgm');
    const npCard = document.getElementById('npCard');
    audio.volume = 0.5;

    function setPlayingUI(isPlaying){
      btn.classList.toggle('playing', isPlaying);
      npCard.classList.toggle('show', isPlaying);
    }

    function tryAutoplay(){
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => {
          setPlayingUI(true);
        }).catch(() => {
          // Trình duyệt chặn tự phát nhạc có tiếng — sẽ phát ngay khi người dùng chạm/click lần đầu
          const startOnce = () => {
            audio.play().then(() => setPlayingUI(true)).catch(()=>{});
            document.removeEventListener('click', startOnce);
            document.removeEventListener('touchstart', startOnce);
          };
          document.addEventListener('click', startOnce, { once:true });
          document.addEventListener('touchstart', startOnce, { once:true });
        });
      }
    }
    tryAutoplay();

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().then(() => setPlayingUI(true)).catch(() => {});
      } else {
        audio.pause();
        setPlayingUI(false);
      }
    });

    // floating embers
    const embersEl = document.getElementById('embers');
    const EMBER_COUNT = 22;
    for (let i = 0; i < EMBER_COUNT; i++) {
      const e = document.createElement('span');
      e.className = 'ember';
      const left = Math.random() * 100;
      const duration = 6 + Math.random() * 7;
      const delay = Math.random() * 10;
      const drift = (Math.random() * 80 - 40) + 'px';
      const size = 2 + Math.random() * 3;
      e.style.left = left + 'vw';
      e.style.width = size + 'px';
      e.style.height = size + 'px';
      e.style.setProperty('--drift', drift);
      e.style.animationDuration = duration + 's';
      e.style.animationDelay = delay + 's';
      embersEl.appendChild(e);
    }

    // WeChat QR popup
    const wechatBtn = document.getElementById('wechatBtn');
    const qrOverlay = document.getElementById('qrOverlay');
    wechatBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      qrOverlay.classList.add('show');
    });
    qrOverlay.addEventListener('click', () => {
      qrOverlay.classList.remove('show');
    });

    // TikTok account picker
    const tiktokBtn = document.getElementById('tiktokBtn');
    const ttOverlay = document.getElementById('ttOverlay');
    tiktokBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ttOverlay.classList.add('show');
    });
    ttOverlay.addEventListener('click', (e) => {
      if (e.target === ttOverlay) ttOverlay.classList.remove('show');
    });
  </script>

</body>
</html>
