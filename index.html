<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GZW_Wolfsamson</title>
<style>
  :root{
    --ink:#e9e4e0;
    --card-bg: rgba(8,8,10,0.42);
    --card-border: rgba(255,255,255,0.14);
    --glow: rgba(180,20,20,0.4);
    --accent:#c94b4b;
    --accent-deep:#8f2f2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:#000 url('bg.png') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  .card{
    position:relative;
    width:min(360px, 88vw);
    padding:38px 26px 26px;
    border-radius:18px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    box-shadow:0 8px 40px rgba(0,0,0,0.6), 0 0 60px var(--glow);
    text-align:center;
    color:var(--ink);
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  /* ambient drifting smoke glow behind everything on the card */
  .card::before{
    content:"";
    position:absolute;
    inset:-40%;
    background:
      radial-gradient(circle at 30% 20%, rgba(201,75,75,0.25), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(140,140,150,0.18), transparent 60%);
    animation:drift 14s ease-in-out infinite alternate;
    z-index:0;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform:translate(-4%,-2%) rotate(0deg); }
    100%{ transform:translate(4%,3%) rotate(8deg); }
  }

  .card > *{ position:relative; z-index:1; }

  @keyframes rise{
    from{opacity:0; transform:translateY(18px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* avatar with a slowly rotating ember ring + gentle float */
  .avatar-wrap{
    position:relative;
    width:110px;
    height:110px;
    margin:0 auto 18px;
    animation:float 4.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 30%, transparent 70%, var(--accent));
    filter:blur(2px);
    animation:spin 6s linear infinite;
    opacity:.85;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
  .avatar{
    position:absolute;
    inset:5px;
    width:100px; height:100px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(0,0,0,0.6);
    box-shadow:0 0 22px rgba(0,0,0,0.7);
  }

  .name{
    font-size:24px;
    font-weight:700;
    letter-spacing:.6px;
    margin-bottom:22px;
    animation:glowpulse 3.2s ease-in-out infinite;
  }
  @keyframes glowpulse{
    0%,100%{ text-shadow:0 0 10px rgba(201,75,75,.5); }
    50%{ text-shadow:0 0 20px rgba(201,75,75,.9), 0 0 34px rgba(201,75,75,.4); }
  }

  .socials{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .social{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:var(--ink);
    text-decoration:none;
    opacity:0;
    animation:fadein .5s ease forwards;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease, color .18s ease;
  }
  .social:nth-child(1){ animation-delay:.5s; }
  .social:nth-child(2){ animation-delay:.65s; }
  .social:nth-child(3){ animation-delay:.8s; }
  @keyframes fadein{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .social:hover{
    transform:translateY(-3px);
    background:var(--accent-deep);
    color:#fff;
    box-shadow:0 6px 16px rgba(201,75,75,.5);
  }
  .social svg{ width:18px; height:18px; }

  .music-btn{
    position:absolute;
    top:14px; right:14px;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:var(--ink);
    cursor:pointer;
    z-index:2;
    transition:background .18s ease, box-shadow .18s ease;
  }
  .music-btn:hover{
    background:var(--accent-deep);
    box-shadow:0 4px 14px rgba(201,75,75,.5);
  }
  .music-btn svg{ width:16px; height:16px; }
  .music-btn .bar{
    display:inline-block; width:2.5px; margin:0 1px;
    background:currentColor; border-radius:2px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .music-btn.playing .bar{ animation-play-state:running; }
  .music-btn:not(.playing) .bar{ animation-play-state:paused; height:4px !important; }
  .bar:nth-child(1){ animation-delay:0s; }
  .bar:nth-child(2){ animation-delay:.15s; }
  .bar:nth-child(3){ animation-delay:.3s; }
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:14px; }
  }
</style>
</head>
<body>

  <div class="card">
    <button class="music-btn" id="musicBtn" aria-label="Bật/tắt nhạc nền">
      <span class="bar" style="height:4px"></span>

      <span class="bar" style="height:4px"></span>
    </button>
    <audio id="bgm" src="music.mp3" loop></audio>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" src="avatar.jpg" alt="avatar">
    </div>

    <div class="name">GZW_Wolfsamson</div>

    </div>
  </div>

  <script>
    const btn = document.getElementById('musicBtn');
    const audio = document.getElementById('bgm');
    audio.volume = 0.5;

    function tryAutoplay(){
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => {
          btn.classList.add('playing');
        }).catch(() => {
          // Trình duyệt chặn tự phát nhạc có tiếng — sẽ phát ngay khi người dùng chạm/click lần đầu
          const startOnce = () => {
            audio.play().then(() => btn.classList.add('playing')).catch(()=>{});
            document.removeEventListener('click', startOnce);
            document.removeEventListener('touchstart', startOnce);
          };
          document.addEventListener('click', startOnce, { once:true });
          document.addEventListener('touchstart', startOnce, { once:true });
        });
      }
    }
    tryAutoplay();

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().catch(() => {});
        btn.classList.add('playing');
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    });
  </script>

</body>
