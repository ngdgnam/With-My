<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>GZW_Wolfsamson</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#f8fafc;
    --muted:#9a9aa3;
    --card-bg:rgba(10,9,12,.5);
    --line:rgba(255,255,255,.13);
    --accent:#f8fafc;
    --accent-2:#71717a;
    --accent-deep:#3f3f46;
    --glow:rgba(113,113,122,.38);
    --font-display:'Rajdhani','Be Vietnam Pro',system-ui,sans-serif;
    --font-body:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  }
  @property --ang{ syntax:'<angle>'; initial-value:0deg; inherits:false; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    min-height:100vh; min-height:100dvh;
    background:#050506;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px; line-height:1.45;
    overflow-x:hidden;
  }
  a,button{ font:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:0; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---------- nền ---------- */
  .bg{
    position:fixed; inset:-6%;
    background:#050506 url('bg.png') center/cover no-repeat;
    transform:translate3d(0,0,0) scale(1.04);
    will-change:transform;
    z-index:0;
  }
  .bg::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 40%, transparent 30%, rgba(0,0,0,.6) 100%);
  }
  .embers{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .ember{
    position:absolute; bottom:-20px; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle,#f8fafc 0%,var(--accent-2) 60%,transparent 100%);
    box-shadow:0 0 6px 2px rgba(248,250,252,.5);
    animation:emberRise linear infinite; opacity:0;
  }
  @keyframes emberRise{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform:translate(var(--drift,30px),-105vh); opacity:0; }
  }
  #trail{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }

  /* ---------- bố cục ---------- */
  .stage{
    position:relative; z-index:3;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .card{
    position:relative; width:100%; max-width:clamp(340px,92vw,440px);
    padding:clamp(28px,5vh,44px) clamp(18px,4vw,30px) clamp(20px,3vh,28px);
    border-radius:28px;
    background:var(--card-bg);
    backdrop-filter:blur(18px) saturate(130%);
    -webkit-backdrop-filter:blur(18px) saturate(130%);
    box-shadow:0 12px 60px rgba(0,0,0,.65), 0 0 80px var(--glow);
    text-align:center; overflow:hidden;
    transition:transform .25s ease-out;
    transform-style:preserve-3d;
  }
  .card.tilting{ transition:transform .08s linear; }
  /* viền sáng chạy quanh thẻ */
  .card::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px; pointer-events:none; z-index:3;
    background:conic-gradient(from var(--ang), rgba(255,255,255,.1) 0 55%, rgba(248,250,252,0) 55%, #a1a1aa 82%, #f8fafc 90%, rgba(248,250,252,0) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation:ang 6s linear infinite;
  }
  @keyframes ang{ to{ --ang:360deg; } }
  /* vệt sáng theo con trỏ */
  .card::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(280px circle at var(--mx,50%) var(--my,25%), rgba(255,255,255,.13), transparent 62%);
    opacity:0; transition:opacity .3s;
  }
  .card:hover::after{ opacity:1; }
  .smoke{
    position:absolute; inset:-40%; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(248,250,252,.12), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(140,140,160,.16), transparent 60%);
    animation:drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{ transform:translate(-4%,-2%) rotate(0); } to{ transform:translate(4%,3%) rotate(8deg); } }
  .card > :not(.smoke){ position:relative; z-index:1; }

  /* ---------- avatar ---------- */
  .avatar-wrap{
    position:relative; width:clamp(108px,17vh,132px); aspect-ratio:1; margin:0 auto 18px;
    animation:float 4.5s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .avatar-ring{
    position:absolute; inset:-7px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 30%, transparent 70%, var(--accent));
    filter:blur(2px); opacity:.9; animation:spin 6s linear infinite;
  }
  .avatar-ring::after{
    content:""; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid var(--accent); opacity:0; animation:pulse 3s ease-out infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{ 0%{ transform:scale(.94); opacity:.7; } 100%{ transform:scale(1.4); opacity:0; } }
  .avatar{
    position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px);
    border-radius:50%; object-fit:cover; border:3px solid rgba(0,0,0,.65);
    box-shadow:0 0 24px rgba(0,0,0,.75);
  }

  /* ---------- tên (glitch) + dòng gõ ---------- */
  .name{
    position:relative; display:inline-block;
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(28px,8vw,40px); letter-spacing:.02em; line-height:1.15; white-space:nowrap; max-width:100%;
    background:linear-gradient(100deg,#f8fafc 0%,#71717a 50%,#f8fafc 100%);
    background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 14px rgba(248,250,252,.28));
    animation:sheen 5s ease-in-out infinite alternate;
  }
  @keyframes sheen{ from{ background-position:0% 0; } to{ background-position:100% 0; } }
  .name::before,.name::after{
    content:attr(data-text); position:absolute; inset:0; text-align:center; opacity:0; pointer-events:none;
  }
  .name::before{ color:#f8fafc; -webkit-text-fill-color:#f8fafc; }
  .name::after{ color:#71717a; -webkit-text-fill-color:#71717a; }
  .name.glitch{ animation:gShake .5s steps(2,end), sheen 5s ease-in-out infinite alternate; }
  .name.glitch::before{ opacity:.85; animation:gA .5s steps(3,end); }
  .name.glitch::after{ opacity:.7; animation:gB .5s steps(3,end); }
  @keyframes gShake{ 0%,100%{ transform:translate(0); } 25%{ transform:translate(-2px,1px); } 50%{ transform:translate(2px,-1px); } 75%{ transform:translate(-1px,0); } }
  @keyframes gA{ 0%{ clip-path:inset(10% 0 60% 0); transform:translate(-3px,0); } 33%{ clip-path:inset(55% 0 10% 0); transform:translate(3px,0); } 66%{ clip-path:inset(30% 0 40% 0); transform:translate(-2px,0); } 100%{ clip-path:inset(0 0 100% 0); transform:translate(0); } }
  @keyframes gB{ 0%{ clip-path:inset(60% 0 10% 0); transform:translate(3px,0); } 33%{ clip-path:inset(5% 0 70% 0); transform:translate(-3px,0); } 66%{ clip-path:inset(45% 0 30% 0); transform:translate(2px,0); } 100%{ clip-path:inset(0 0 100% 0); transform:translate(0); } }

  .tagline{
    height:1.6em; margin:8px 0 22px; color:var(--muted); font-size:14px; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center;
  }
  .tagline .type::after{
    content:""; display:inline-block; width:2px; height:1.05em; margin-left:3px; vertical-align:-2px;
    background:var(--accent); animation:caret 1s steps(1) infinite;
  }
  @keyframes caret{ 50%{ opacity:0; } }

  /* ---------- liên kết ---------- */
  .links{ display:flex; flex-direction:column; gap:10px; }
  .link{
    position:relative; overflow:hidden;
    display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:14px;
    width:100%; padding:10px 16px 10px 10px; text-align:left; text-decoration:none;
    border-radius:16px; background:rgba(255,255,255,.06); border:1px solid var(--line);
    transition:background .2s, border-color .2s, box-shadow .2s, transform .15s ease-out;
  }
  .link:hover,.link:focus-visible{
    background:rgba(248,250,252,.10); border-color:rgba(248,250,252,.4);
    box-shadow:0 8px 26px rgba(113,113,122,.35);
  }
  .link .ico{
    width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    background:rgba(255,255,255,.08); border:1px solid var(--line);
    transition:transform .15s ease-out, background .2s, color .2s;
  }
  .link:hover .ico{ background:var(--accent-deep); color:#fff; }
  .link .ico svg{ width:21px; height:21px; }
  .link .txt{ min-width:0; display:flex; flex-direction:column; }
  .link .txt b{ font-weight:600; font-size:15px; }
  .link .txt small{ color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .link .arr{ color:var(--muted); transition:transform .2s, color .2s; }
  .link:hover .arr{ transform:translateX(4px); color:var(--accent); }
  .rip{
    position:absolute; width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.4);
    transform:translate(-50%,-50%) scale(0); animation:rip .6s ease-out forwards; pointer-events:none;
  }
  @keyframes rip{ to{ transform:translate(-50%,-50%) scale(30); opacity:0; } }

  /* ---------- hiện dần khi vào ---------- */
  .rise{ opacity:0; transform:translateY(16px); }
  body.entered .rise{ animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i,0) * 90ms + 150ms); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .card{ opacity:0; transform:scale(.97); }
  body.entered .card{ animation:cardIn .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:scale(1); } }
  body.entered .card.tilt-on{ animation:none; opacity:1; transform:none; }

  /* ---------- màn hình chào ---------- */
  .splash{
    position:fixed; inset:0; z-index:30; display:grid; place-items:center; text-align:center;
    background:rgba(4,4,6,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:opacity .8s ease, backdrop-filter .8s ease, visibility 0s .8s;
    padding:24px; cursor:pointer; width:100%; color:var(--ink);
  }
  body.entered .splash{ opacity:0; visibility:hidden; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); pointer-events:none; }
  .splash-in{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .splash img{ width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.25); box-shadow:0 0 40px var(--glow); }
  .splash .s-name{ font-family:var(--font-display); font-weight:700; font-size:clamp(28px,8vw,36px); letter-spacing:.03em; white-space:nowrap; }
  .splash .s-go{
    margin-top:6px; padding:12px 26px; border-radius:99px; border:1px solid rgba(248,250,252,.5);
    background:rgba(248,250,252,.08); letter-spacing:.14em; text-transform:uppercase; font-size:12.5px; font-weight:600;
    animation:breathe 2.2s ease-in-out infinite;
  }
  .splash .s-sub{ font-size:12px; color:var(--muted); }
  @keyframes breathe{ 0%,100%{ box-shadow:0 0 0 0 rgba(248,250,252,.35); } 50%{ box-shadow:0 0 0 12px rgba(248,250,252,0); } }

  .splash[hidden]{ display:none; }

  /* ---------- hộp thoại ---------- */
  .overlay{
    position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px;
    background:rgba(3,3,5,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; visibility:hidden; transition:opacity .25s, visibility 0s .25s;
  }
  .overlay.show{ opacity:1; visibility:visible; transition:opacity .25s; }
  .sheet{
    position:relative; width:min(340px,100%); padding:26px 20px 20px; text-align:center;
    border-radius:22px; background:rgba(18,16,22,.92); border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 60px var(--glow);
    transform:translateY(12px) scale(.96); transition:transform .25s ease;
  }
  .overlay.show .sheet{ transform:none; }
  .sheet h2{ font-family:var(--font-display); font-size:20px; margin-bottom:14px; }
  .sheet .lbl{ font-size:12px; color:var(--muted); margin-bottom:6px; }
  .sheet .val{
    margin-bottom:12px; padding:11px 12px; border-radius:12px; background:rgba(255,255,255,.07);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14.5px; word-break:break-all; user-select:all;
  }
  .sheet .qr{ width:100%; border-radius:12px; background:#fff; display:block; margin-bottom:10px; }
  .sheet p.cap{ font-size:13px; color:var(--muted); }
  .btn{
    display:block; width:100%; padding:12px 14px; margin-top:10px; border-radius:12px; text-align:center;
    text-decoration:none; font-weight:600; font-size:14.5px;
    background:rgba(255,255,255,.08); border:1px solid var(--line); transition:background .15s;
  }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .btn.primary{ background:#5865F2; border-color:#5865F2; color:#fff; }
  .btn.primary:hover{ background:#6b77f5; }
  .x{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    display:grid; place-items:center; color:var(--muted); font-size:20px; line-height:1;
  }
  .x:hover{ background:rgba(255,255,255,.1); color:var(--ink); }

  /* ---------- laptop / màn rộng ---------- */
  @media (min-width:900px){
    body{ font-size:16px; }
    .card{ max-width:460px; }
    .link{ padding:12px 18px 12px 12px; }
  }
  @media (max-height:640px){
    .stage{ align-items:flex-start; }
    .avatar-wrap{ width:96px; margin-bottom:12px; }
    .tagline{ margin-bottom:14px; }
  }
  @media (prefers-reduced-motion:reduce){
    .name,.card::before,.smoke,.avatar-wrap,.avatar-ring,.avatar-ring::after,.ember,.splash .s-go,.tagline .type::after{ animation:none !important; }
    body.entered .rise,body.entered .card{ animation:none !important; opacity:1; transform:none; }
    .rise,.card{ opacity:1; transform:none; }
  }
</style>
</head>

          <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.6 3.6C4.3 3.6 1 6.4 1 9.9c0 2 1.1 3.8 2.8 5-.1.5-.5 1.6-.6 1.9-.1.3.1.3.2.2.1 0 1.6-1 2.2-1.4.6.2 1.3.3 2 .3h.2c-.1-.4-.2-.8-.2-1.2 0-3.5 3.5-6.3 7.8-6.3.3 0 .5 0 .8 0-.6-3.1-4.1-5.4-7.6-5.4zm-2.6 3.8c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm5.2 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zM16 10.4c-3.6 0-6.5 2.4-6.5 5.4S12.4 21.2 16 21.2c.6 0 1.2-.1 1.7-.2.5.3 1.7 1.1 1.8 1.1.1.1.3.1.2-.2-.1-.2-.4-1.1-.5-1.5 1.4-1 2.3-2.5 2.3-4.2 0-3-2.9-5.4-6.5-5.4zm-2.2 3c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.4 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/></svg></span><span class="txt"><b>WeChat</b><small>Quét mã QR</small></span><span class="arr" aria-hidden="true">→</span>
        </button>
      </nav>

  <audio id="bgm" src="music.mp3" loop preload="auto"></audio>

  <button class="splash" id="splash" type="button" aria-label="Chạm để vào trang">
    <span class="splash-in">
      <img src="avatar.jpg" alt="">
      <span class="s-name">GZW_Wolfsamson</span>
      <span class="s-go">Chạm để vào</span>
      <span class="s-sub">Trang có nhạc nền, bật loa nhé</span>
    </span>
  </button>

  <div class="overlay" id="dcOverlay" role="dialog" aria-modal="true" aria-label="Kết bạn Discord">
    <div class="sheet">
      <button class="x" type="button" data-close aria-label="Đóng">×</button>
      <h2>Kết bạn Discord</h2>
      <p class="lbl">Tên người dùng</p>
      <div class="val" id="dcName">nguyendangnam_17</div>
      <a class="btn primary" href="https://discord.com/users/1167056839700136038" target="_blank" rel="noopener">Mở hồ sơ để kết bạn</a>
      <button class="btn" id="dcCopy" type="button">Sao chép tên</button>
    </div>
  </div>

  <div class="overlay" id="ttOverlay" role="dialog" aria-modal="true" aria-label="Chọn tài khoản TikTok">
    <div class="sheet">
      <button class="x" type="button" data-close aria-label="Đóng">×</button>
      <h2>Chọn tài khoản TikTok</h2>
      <a class="btn" href="https://www.tiktok.com/@ngdgnam207?_r=1&_t=ZS-98XveOuwAiL" target="_blank" rel="noopener">@ngdgnam207</a>
      <a class="btn" href="https://www.tiktok.com/@ngkhungmathmath?_r=1&_t=ZS-98XvzfzUKY9" target="_blank" rel="noopener">@ngkhungmathmath</a>
    </div>
  </div>

  <div class="overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-label="Mã QR WeChat">
    <div class="sheet">
      <button class="x" type="button" data-close aria-label="Đóng">×</button>
      <h2>Kết bạn WeChat</h2>
      <img class="qr" src="wechat-qr.jpg" alt="Mã QR WeChat">
      <p class="cap">Quét mã để kết bạn WeChat</p>
    </div>
  </div>

  <script>
  (function(){
    var $ = function(s){ return document.querySelector(s); };
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var hoverDev = matchMedia('(hover: hover) and (pointer: fine)').matches;

    /* ---------- màn hình chào + nhạc ---------- */
    var audio = $('#bgm'); audio.volume = 0.5;
    var splash = $('#splash');
    var orientAsked = false;
    function enter(){
      if (document.body.classList.contains('entered')) return;
      document.body.classList.add('entered');
      audio.play().catch(function(){});
      if (!orientAsked && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
        orientAsked = true;
        DeviceOrientationEvent.requestPermission().then(function(r){ if (r === 'granted') listenTilt(); }).catch(function(){});
      }
      setTimeout(function(){ splash.setAttribute('hidden',''); startTyping(); glitchLoop(); }, 850);
    }
    splash.addEventListener('click', enter);

    /* ---------- dòng chữ tự gõ ---------- */
    var phrases = ['Chào bạn, rất vui được gặp', 'Discord: nguyendangnam_17', 'Instagram: @ngg_nam207', 'GitHub: ngdgnam', 'Bật loa lên nhé'];
    var typeEl = $('#type');
    function startTyping(){
      if (reduce){ typeEl.textContent = phrases[0]; return; }
      var pi = 0, ci = 0, del = false;
      (function tick(){
        var full = phrases[pi];
        typeEl.textContent = full.slice(0, ci);
        var wait = del ? 26 : 62;
        if (!del && ci === full.length){ del = true; wait = 1700; }
        else if (del && ci === 0){ del = false; pi = (pi + 1) % phrases.length; wait = 380; }
        else ci += del ? -1 : 1;
        setTimeout(tick, wait);
      })();
    }
    if (reduce) typeEl.textContent = phrases[0];

    /* ---------- tên bị nhiễu thỉnh thoảng ---------- */
    function glitchLoop(){
      if (reduce) return;
      var n = $('#name');
      (function go(){
        setTimeout(function(){
          n.classList.add('glitch');
          setTimeout(function(){ n.classList.remove('glitch'); go(); }, 520);
        }, 3500 + Math.random() * 3500);
      })();
    }

    /* ---------- đốm lửa bay ---------- */
    var embersEl = $('#embers');
    var count = innerWidth < 600 ? 14 : 24;
    for (var i = 0; i < count; i++){
      var e = document.createElement('span');
      e.className = 'ember';
      var size = 2 + Math.random() * 3;
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.width = e.style.height = size + 'px';
      e.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      e.style.animationDuration = (6 + Math.random() * 7) + 's';
      e.style.animationDelay = (Math.random() * 10) + 's';
      embersEl.appendChild(e);
    }

    /* ---------- nền chuyển động (chuột hoặc nghiêng điện thoại) ---------- */
    var bg = $('#bg'), tx = 0, ty = 0, cx = 0, cy = 0;
    function setTarget(nx, ny){ tx = -nx * 26; ty = -ny * 26; }
    if (!reduce){
      addEventListener('pointermove', function(ev){
        if (ev.pointerType === 'touch') return;
        setTarget(ev.clientX / innerWidth - .5, ev.clientY / innerHeight - .5);
      });
      (function loop(){
        cx += (tx - cx) * .06; cy += (ty - cy) * .06;
        bg.style.transform = 'translate3d(' + cx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px,0) scale(1.04)';
        requestAnimationFrame(loop);
      })();
    }
    var tiltBound = false;
    function listenTilt(){
      if (tiltBound || reduce) return; tiltBound = true;
      addEventListener('deviceorientation', function(ev){
        if (ev.gamma == null) return;
        var g = Math.max(-30, Math.min(30, ev.gamma)) / 60;
        var b = Math.max(-30, Math.min(30, (ev.beta || 0) - 45)) / 60;
        setTarget(g, b);
      });
    }
    if (!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') && !hoverDev) listenTilt();

    /* ---------- vệt lửa theo con trỏ ---------- */
    if (hoverDev && !reduce){
      var cv = $('#trail'), ctx = cv.getContext('2d'), parts = [];
      function size(){ var d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
      size(); addEventListener('resize', size);
      addEventListener('pointermove', function(ev){
        for (var k = 0; k < 2; k++) parts.push({ x: ev.clientX, y: ev.clientY, vx: (Math.random() - .5) * 1.2, vy: -Math.random() * 1.2 - .3, life: 1, r: 3 + Math.random() * 5 });
        if (parts.length > 120) parts.splice(0, parts.length - 120);
      });
      (function draw(){
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.globalCompositeOperation = 'lighter';
        for (var j = parts.length - 1; j >= 0; j--){
          var p = parts[j]; p.x += p.vx; p.y += p.vy; p.life -= .028;
          if (p.life <= 0){ parts.splice(j, 1); continue; }
          var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
          g.addColorStop(0, 'rgba(248,250,252,' + (p.life * .9) + ')');
          g.addColorStop(.45, 'rgba(161,161,170,' + (p.life * .5) + ')');
          g.addColorStop(1, 'rgba(248,250,252,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, 6.2832); ctx.fill();
        }
        requestAnimationFrame(draw);
      })();
    } else { $('#trail').hidden = true; }

    /* ---------- thẻ nghiêng + vệt sáng ---------- */
    var card = $('#card');
    if (hoverDev && !reduce){
      card.addEventListener('pointermove', function(ev){
        var r = card.getBoundingClientRect();
        var x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
        card.classList.add('tilting', 'tilt-on');
        card.style.setProperty('--mx', (x * 100) + '%'); card.style.setProperty('--my', (y * 100) + '%');
        card.style.transform = 'perspective(900px) rotateY(' + ((x - .5) * 9) + 'deg) rotateX(' + ((.5 - y) * 9) + 'deg)';
      });
      card.addEventListener('pointerleave', function(){ card.classList.remove('tilting'); card.style.transform = ''; });
    }

    /* ---------- biểu tượng bị nam châm hút + gợn sóng ---------- */
    document.querySelectorAll('.link').forEach(function(l){
      var ico = l.querySelector('.ico');
      if (hoverDev && !reduce){
        l.addEventListener('pointermove', function(ev){
          var r = l.getBoundingClientRect();
          var x = (ev.clientX - r.left) / r.width - .5, y = (ev.clientY - r.top) / r.height - .5;
          l.style.transform = 'translate(' + (x * 6) + 'px,' + (y * 4) + 'px)';
          ico.style.transform = 'translate(' + (x * 16) + 'px,' + (y * 10) + 'px) scale(1.06)';
        });
        l.addEventListener('pointerleave', function(){ l.style.transform = ''; ico.style.transform = ''; });
      }
      l.addEventListener('pointerdown', function(ev){
        var r = l.getBoundingClientRect(), d = document.createElement('span');
        d.className = 'rip'; d.style.left = (ev.clientX - r.left) + 'px'; d.style.top = (ev.clientY - r.top) + 'px';
        l.appendChild(d); setTimeout(function(){ d.remove(); }, 650);
      });
    });

    /* ---------- hộp thoại ---------- */
    var lastFocus = null;
    function open(id, from){ lastFocus = from; var o = $(id); o.classList.add('show'); var f = o.querySelector('a.btn,button.btn,.x'); if (f) f.focus({ preventScroll: true }); }
    function closeAll(){ document.querySelectorAll('.overlay.show').forEach(function(o){ o.classList.remove('show'); }); if (lastFocus) lastFocus.focus({ preventScroll: true }); }
    $('#discordBtn').addEventListener('click', function(){ open('#dcOverlay', this); });
    $('#tiktokBtn').addEventListener('click', function(){ open('#ttOverlay', this); });
    $('#wechatBtn').addEventListener('click', function(){ open('#qrOverlay', this); });
    document.querySelectorAll('.overlay').forEach(function(o){
      o.addEventListener('click', function(ev){ if (ev.target === o || ev.target.hasAttribute('data-close')) closeAll(); });
    });
    addEventListener('keydown', function(ev){
      if (ev.key === 'Escape') closeAll();
      if ((ev.key === 'Enter' || ev.key === ' ') && !document.body.classList.contains('entered') && document.activeElement === document.body){ ev.preventDefault(); enter(); }
    });

    var copyBtn = $('#dcCopy');
    copyBtn.addEventListener('click', function(){
      var el = $('#dcName'), text = el.textContent.trim();
      function done(){ copyBtn.textContent = 'Đã sao chép'; setTimeout(function(){ copyBtn.textContent = 'Sao chép tên'; }, 1600); }
      function fallback(){
        var r = document.createRange(); r.selectNodeContents(el);
        var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        try { if (document.execCommand('copy')) done(); } catch (e) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });
  })();
  </script>
</body>
</html>
